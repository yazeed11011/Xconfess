name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Validate route cache policy manifest
        run: npm run validate:cache-policy --workspace=xconfess-frontend
      - run: npm run audit:ci
      - name: Test deterministic backend clock behavior
        working-directory: xconfess-backend
        run: >-
          npm test -- --runTestsByPath
          src/confession/confession-scheduler.service.spec.ts
          src/confession-draft/confession-draft.service.spec.ts
      - name: Enforce dependency license and change policy
        run: npm run dependency:policy -- --base "${{ github.event.before || 'HEAD^' }}"
      - name: Retain dependency policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-policy-report
          path: dependency-policy-report.json
          if-no-files-found: warn
          retention-days: 90

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run frontend:test

  # ── Startup budget (issue #462) ──────────────────────────────────────────
  # Measures backend and frontend cold-start phases against documented
  # budgets and fails the build on regression. See docs/STARTUP_BUDGET.md.
  startup-budget:
    name: Performance / Startup budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Build frontend for route-budget measurement
        run: npm --prefix xconfess-frontend run build
      - name: Run startup budget harness tests
        run: npm run benchmark:triage:test
      - name: Enforce frontend startup budget
        run: npm run frontend:budget
      - name: Retain startup budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-budget-report
          path: startup-budget-report.json
          if-no-files-found: warn
          retention-days: 90

  secret-scan:
    name: Security / Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the scanner's self-test first: verifies the scanner itself catches
      # the expected pattern categories before scanning the real repo.
      - run: ./scripts/secret-scanning-preflight.sh --self-test
      # Full repository scan. Exits non-zero and prints findings if any
      # unredacted secrets are detected (see docs/TEST_DATA_PRIVACY.md).
      - run: ./scripts/secret-scanning-preflight.sh

  # ── Migration gate (issue #129) ──────────────────────────────────────────
  # Validates migration ordering, up/down method presence, and flags
  # destructive DDL that has not been explicitly acknowledged.
  migration-gate:
    name: Security / Migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Run migration gate
        run: node scripts/migration-gate.js
      - name: Run data classification gate
        run: npm run data-classification:gate
      - name: Run privacy governance regression tests
        working-directory: xconfess-backend
        run: >-
          npx jest --config jest.config.js --runInBand --runTestsByPath
          src/analytics/analytics-event.service.spec.ts
          src/analytics/analytics.constants.spec.ts
          src/admin/services/admin.service.spec.ts
          src/audit-log/audit-log.service.spec.ts
          src/moderation/language-evaluation.service.spec.ts
      - name: Test data classification gate
        run: node --test scripts/__tests__/data-classification-gate.test.js

  # ── Module map staleness (issue #464) ────────────────────────────────────
  # Regenerates the contributor module map from .github/CODEOWNERS and the
  # repository layout, then fails if the committed artifact is out of date.
  # See docs/MODULE_MAP.md.
  module-map:
    name: Docs / module map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Run module map generator tests
        run: npm run module-map:test
      - name: Verify module map is not stale
        run: npm run module-map:check

  doc-link-audit:
    name: Docs / link audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run visual regression fixtures
        env:
          CI: "true"
          TZ: UTC
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: npx playwright test --config=frontend/playwright.visual.config.ts
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
